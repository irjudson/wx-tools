name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file
      run: |
        echo "DATABASE_URL=sqlite:///./test_weather.db" > .env
        echo "STATION_PASSKEY=test_passkey_for_ci" >> .env
        echo "LOG_LEVEL=INFO" >> .env

    - name: Initialize database
      run: |
        PYTHONPATH=. python scripts/init_db.py

    - name: Run tests
      run: |
        PYTHONPATH=. pytest -v --cov=src --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t weather-service:test .

    - name: Test Docker image
      run: |
        docker run --rm \
          -e DATABASE_URL=sqlite:///./test_weather.db \
          -e STATION_PASSKEY=test_passkey \
          weather-service:test python -c "import src.main; print('Import successful')"
