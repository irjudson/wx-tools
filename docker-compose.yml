version: '3.8'

services:
  weather-service:
    container_name: wx-service
    build: .
    ports:
      - "7000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@host.docker.internal:5432/weather_data}
      - STATION_PASSKEY=${STATION_PASSKEY:-change_me}
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - shared-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  shared-infra:
    external: true
