<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Weather Station{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">
    <link rel="stylesheet" href="/static/css/style.css?v=3.0">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h1>Weather Station</h1>
            </div>

            <!-- Station Statistics -->
            <div class="station-stats glass">
                <div class="stats-header">
                    <span class="stats-icon">📊</span>
                    <h3>Station Statistics</h3>
                </div>
                <div id="database-stats" class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value">--</div>
                        <div class="stat-label">Last Reading</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">--</div>
                        <div class="stat-label">Coverage</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">--</div>
                        <div class="stat-label">First Reading</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">--</div>
                        <div class="stat-label">Total Readings</div>
                    </div>
                </div>
            </div>

            <nav class="nav-menu">
                {% block nav_menu %}
                {# Navigation must be provided by each page #}
                {% endblock %}
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
